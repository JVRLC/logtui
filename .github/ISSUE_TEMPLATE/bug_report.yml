name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve LogTUI. Remove secrets from all logs.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: Include the command and the smallest safe log sample possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LogTUI version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, terminal, and Python version
    validations:
      required: true

