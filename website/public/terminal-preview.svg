<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="LogTUI terminal preview">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pillSearch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Monaco, Consolas, monospace; }
    .muted { fill: #64748b; }
    .bright { fill: #f8fafc; }
    .subtle { fill: #94a3b8; }
    .green { fill: #4ade80; }
    .yellow { fill: #facc15; }
    .red { fill: #f87171; }
    .cyan { fill: #38bdf8; }
    .purple { fill: #a78bfa; }
    .blue-service { fill: #38bdf8; font-weight: 700; }
  </style>

  <!-- Terminal Window Background with Drop Shadow -->
  <rect x="10" y="10" width="1180" height="640" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header / Title Bar -->
  <rect x="10" y="10" width="1180" height="46" rx="16" fill="url(#headerGrad)"/>
  <rect x="10" y="44" width="1180" height="12" fill="#0f172a"/>
  <line x1="10" y1="56" x2="1190" y2="56" stroke="#334155" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="36" cy="33" r="6.5" fill="#ef4444" stroke="#dc2626" stroke-width="0.5"/>
  <circle cx="58" cy="33" r="6.5" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>
  <circle cx="80" cy="33" r="6.5" fill="#10b981" stroke="#059669" stroke-width="0.5"/>

  <!-- Header Title & Clock -->
  <text x="510" y="38" class="bright" font-size="15" font-weight="700" letter-spacing="0.5">LogTUI — Live log explorer</text>
  <text x="1100" y="38" class="muted" font-size="14">18:42:09</text>

  <!-- Workspace Split: Sidebar (x: 10 -> 265) -->
  <rect x="10" y="56" width="255" height="544" fill="#0b1120"/>
  <line x1="265" y1="56" x2="265" y2="600" stroke="#1e293b" stroke-width="1"/>

  <!-- Sidebar: SOURCES -->
  <text x="28" y="86" class="cyan" font-size="12" font-weight="800" letter-spacing="1">SOURCES</text>

  <!-- Source item 1 (active) -->
  <rect x="18" y="98" width="238" height="28" rx="6" fill="#1e293b" fill-opacity="0.6"/>
  <text x="28" y="117" class="cyan" font-size="14" font-weight="700">▶</text>
  <text x="44" y="117" class="cyan" font-size="13" font-weight="700">demo.log</text>
  <text x="215" y="117" class="bright" font-size="13" font-weight="700">1,943</text>

  <!-- Source item 2 -->
  <circle cx="33" cy="144" r="4.5" fill="#4ade80"/>
  <text x="44" y="148" class="subtle" font-size="13">worker.log</text>
  <text x="225" y="148" class="muted" font-size="13">412</text>

  <!-- Source item 3 (docker container) -->
  <circle cx="33" cy="174" r="4.5" fill="#4ade80"/>
  <text x="44" y="178" class="subtle" font-size="13">docker:api</text>
  <text x="225" y="178" class="muted" font-size="13">280</text>

  <!-- Sidebar: LEVELS Summary -->
  <line x1="22" y1="206" x2="252" y2="206" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="232" class="muted" font-size="12" font-weight="800" letter-spacing="1">LEVELS</text>

  <circle cx="33" cy="257" r="4.5" fill="#f87171"/>
  <text x="46" y="261" class="red" font-size="13" font-weight="700">● ERR</text>
  <text x="225" y="261" class="bright" font-size="13" font-weight="700">24</text>

  <text x="30" y="289" class="yellow" font-size="11" font-weight="700">▲</text>
  <text x="46" y="289" class="yellow" font-size="13" font-weight="700">WARN</text>
  <text x="225" y="289" class="bright" font-size="13" font-weight="700">68</text>

  <text x="31" y="317" class="green" font-size="12" font-weight="700">ℹ</text>
  <text x="46" y="317" class="green" font-size="13" font-weight="700">INFO</text>
  <text x="210" y="317" class="bright" font-size="13" font-weight="700">1,420</text>

  <text x="33" y="345" class="cyan" font-size="14" font-weight="700">·</text>
  <text x="46" y="345" class="cyan" font-size="13" font-weight="700">DEBUG</text>
  <text x="225" y="345" class="bright" font-size="13" font-weight="700">431</text>

  <!-- Visual Level Distribution Bar -->
  <g transform="translate(26, 362)">
    <rect x="0" y="0" width="22" height="12" rx="3" fill="#f87171"/>
    <rect x="24" y="0" width="34" height="12" rx="3" fill="#facc15"/>
    <rect x="60" y="0" width="108" height="12" rx="3" fill="#4ade80"/>
    <rect x="170" y="0" width="46" height="12" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Sidebar: Buffer Footer -->
  <line x1="22" y1="520" x2="252" y2="520" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="550" class="muted" font-size="13">Buffer</text>
  <text x="76" y="550" class="bright" font-size="14" font-weight="700">1,943</text>
  <text x="120" y="550" class="muted" font-size="13">/ 10,000</text>
  <text x="28" y="574" class="muted" font-size="12">19% memory usage</text>

  <!-- Main Content: Top Title Bar (y: 56 -> 96) -->
  <rect x="265" y="56" width="925" height="40" fill="#0f172a" fill-opacity="0.8"/>
  <line x1="265" y1="96" x2="1190" y2="96" stroke="#1e293b" stroke-width="1"/>
  <text x="285" y="82" class="bright" font-size="15" font-weight="700">Live events</text>

  <!-- Top Toolbar Filter Tags -->
  <!-- Search pill -->
  <g transform="translate(680, 66)">
    <rect width="135" height="22" rx="5" fill="url(#pillSearch)"/>
    <text x="8" y="16" fill="#020617" font-size="11.5" font-weight="800">🔍 "database"</text>
  </g>

  <!-- Level pill -->
  <g transform="translate(825, 66)">
    <rect width="90" height="22" rx="5" fill="#1e3a8a"/>
    <text x="9" y="16" fill="#ffffff" font-size="11.5" font-weight="700">LVL: WARN+</text>
  </g>

  <!-- Source pill -->
  <g transform="translate(925, 66)">
    <rect width="110" height="22" rx="5" fill="#0f766e"/>
    <text x="9" y="16" fill="#ffffff" font-size="11.5" font-weight="700">SRC: demo.log</text>
  </g>

  <!-- Follow pill -->
  <g transform="translate(1045, 66)">
    <rect width="105" height="22" rx="5" fill="#064e3b"/>
    <text x="10" y="16" class="green" font-size="11.5" font-weight="800">FOLLOW: ON</text>
  </g>

  <!-- Table Column Headers (y: 96 -> 126) -->
  <rect x="265" y="96" width="925" height="30" fill="#0b1120"/>
  <line x1="265" y1="126" x2="1190" y2="126" stroke="#1e293b" stroke-width="1"/>
  <text x="285" y="116" class="muted" font-size="12" font-weight="700">TIME</text>
  <text x="390" y="116" class="muted" font-size="12" font-weight="700">LEVEL</text>
  <text x="480" y="116" class="muted" font-size="12" font-weight="700">SERVICE</text>
  <text x="590" y="116" class="muted" font-size="12" font-weight="700">SOURCE</text>
  <text x="700" y="116" class="muted" font-size="12" font-weight="700">MESSAGE</text>

  <!-- Table Row 1 -->
  <g transform="translate(265, 126)">
    <rect width="925" height="42" fill="#090d16"/>
    <text x="20" y="27" class="muted" font-size="13">09:04:03</text>
    <!-- Pill Badge: INFO -->
    <rect x="120" y="10" width="58" height="22" rx="5" fill="#052e16"/>
    <text x="131" y="26" class="green" font-size="12" font-weight="800">INFO</text>
    <text x="215" y="27" class="blue-service" font-size="13">billing</text>
    <text x="325" y="27" class="purple" font-size="13">demo.log</text>
    <text x="435" y="27" class="bright" font-size="13">Payment confirmed: pay_77ac91 ($49.90 via Stripe)</text>
  </g>

  <!-- Table Row 2 (Selected / Cursor Row) -->
  <g transform="translate(265, 168)">
    <rect width="925" height="44" fill="#1e293b"/>
    <rect width="4" height="44" fill="#38bdf8"/>
    <text x="20" y="28" class="muted" font-size="13">09:06:35</text>
    <!-- Pill Badge: ERROR -->
    <rect x="120" y="11" width="58" height="22" rx="5" fill="#450a0a"/>
    <text x="126" y="27" class="red" font-size="12" font-weight="800">ERROR</text>
    <text x="215" y="28" class="blue-service" font-size="13">database</text>
    <text x="325" y="28" class="purple" font-size="13">demo.log</text>
    <text x="435" y="28" class="red" font-size="13">Database query timeout (duration_ms: 3004, query: SELECT * FROM audit)</text>
  </g>

  <!-- Table Row 3 -->
  <g transform="translate(265, 212)">
    <rect width="925" height="42" fill="#090d16"/>
    <text x="20" y="27" class="muted" font-size="13">09:08:47</text>
    <!-- Pill Badge: WARN -->
    <rect x="120" y="10" width="58" height="22" rx="5" fill="#451a03"/>
    <text x="129" y="26" class="yellow" font-size="12" font-weight="800">WARN</text>
    <text x="215" y="27" class="blue-service" font-size="13">worker</text>
    <text x="325" y="27" class="purple" font-size="13">worker.log</text>
    <text x="435" y="27" class="yellow" font-size="13">High memory usage: job_8842 allocated 782MB of 1024MB limit</text>
  </g>

  <!-- Table Row 4 -->
  <g transform="translate(265, 254)">
    <rect width="925" height="42" fill="#0b1120"/>
    <text x="20" y="27" class="muted" font-size="13">09:09:22</text>
    <!-- Pill Badge: ERROR -->
    <rect x="120" y="10" width="58" height="22" rx="5" fill="#450a0a"/>
    <text x="126" y="26" class="red" font-size="12" font-weight="800">ERROR</text>
    <text x="215" y="27" class="blue-service" font-size="13">payments</text>
    <text x="325" y="27" class="purple" font-size="13">demo.log</text>
    <text x="435" y="27" class="red" font-size="13">Payment provider unavailable: 503 upstream connection dropped</text>
  </g>

  <!-- Table Row 5 -->
  <g transform="translate(265, 296)">
    <rect width="925" height="42" fill="#090d16"/>
    <text x="20" y="27" class="muted" font-size="13">09:12:15</text>
    <!-- Pill Badge: DEBUG -->
    <rect x="120" y="10" width="58" height="22" rx="5" fill="#0c4a6e"/>
    <text x="126" y="26" class="cyan" font-size="12" font-weight="800">DEBUG</text>
    <text x="215" y="27" class="blue-service" font-size="13">database</text>
    <text x="325" y="27" class="purple" font-size="13">demo.log</text>
    <text x="435" y="27" class="bright" font-size="13">Query executed in 14ms: SELECT * FROM projects WHERE owner_id = $1</text>
  </g>

  <!-- Table Row 6 -->
  <g transform="translate(265, 338)">
    <rect width="925" height="42" fill="#0b1120"/>
    <text x="20" y="27" class="muted" font-size="13">09:13:10</text>
    <!-- Pill Badge: INFO -->
    <rect x="120" y="10" width="58" height="22" rx="5" fill="#052e16"/>
    <text x="131" y="26" class="green" font-size="12" font-weight="800">INFO</text>
    <text x="215" y="27" class="blue-service" font-size="13">api</text>
    <text x="325" y="27" class="purple" font-size="13">docker:api</text>
    <text x="435" y="27" class="bright" font-size="13">GET /api/v1/health HTTP/1.1 status=200 duration=8ms user_id=usr_42</text>
  </g>

  <!-- Table Row 7 -->
  <g transform="translate(265, 380)">
    <rect width="925" height="42" fill="#090d16"/>
    <text x="20" y="27" class="muted" font-size="13">09:14:35</text>
    <!-- Pill Badge: CRIT -->
    <rect x="120" y="10" width="58" height="22" rx="5" fill="#7f1d1d"/>
    <text x="131" y="26" fill="#ffffff" font-size="12" font-weight="800">CRIT</text>
    <text x="215" y="27" class="blue-service" font-size="13">database</text>
    <text x="325" y="27" class="purple" font-size="13">demo.log</text>
    <text x="435" y="27" class="red" font-size="13">Deadlock detected on table reservations: aborting transaction tx_819</text>
  </g>

  <!-- Table Row 8 -->
  <g transform="translate(265, 422)">
    <rect width="925" height="42" fill="#0b1120"/>
    <text x="20" y="27" class="muted" font-size="13">09:16:02</text>
    <!-- Pill Badge: WARN -->
    <rect x="120" y="10" width="58" height="22" rx="5" fill="#451a03"/>
    <text x="129" y="26" class="yellow" font-size="12" font-weight="800">WARN</text>
    <text x="215" y="27" class="blue-service" font-size="13">auth</text>
    <text x="325" y="27" class="purple" font-size="13">docker:api</text>
    <text x="435" y="27" class="yellow" font-size="13">Rate limit threshold reached for IP 192.168.1.104 (95/100 requests)</text>
  </g>

  <!-- Status Bar (y: 560 -> 600) -->
  <rect x="265" y="560" width="925" height="40" fill="#0b1329"/>
  <line x1="265" y1="560" x2="1190" y2="560" stroke="#1e293b" stroke-width="1"/>
  <circle cx="286" cy="580" r="5" fill="#4ade80"/>
  <text x="298" y="584" class="green" font-size="13" font-weight="700">● LIVE</text>
  <text x="355" y="584" class="subtle" font-size="13">Following files</text>
  <text x="1040" y="584" class="cyan" font-size="13" font-weight="700">92 of 1,943 events</text>

  <!-- Footer Keyboard Shortcuts Bar (y: 600 -> 650) -->
  <rect x="10" y="600" width="1180" height="48" rx="16" fill="url(#headerGrad)"/>
  <rect x="10" y="600" width="1180" height="12" fill="#0f172a"/>
  <line x1="10" y1="600" x2="1190" y2="600" stroke="#334155" stroke-width="1"/>

  <!-- Footer Key Badges -->
  <g font-size="13">
    <!-- q Quit -->
    <rect x="26" y="614" width="22" height="20" rx="4" fill="#334155"/>
    <text x="32" y="629" class="yellow" font-weight="800">q</text>
    <text x="54" y="629" class="bright">Quit</text>

    <!-- space Pause -->
    <rect x="110" y="614" width="50" height="20" rx="4" fill="#334155"/>
    <text x="117" y="629" class="yellow" font-weight="800">space</text>
    <text x="166" y="629" class="bright">Pause</text>

    <!-- / Search -->
    <rect x="235" y="614" width="20" height="20" rx="4" fill="#334155"/>
    <text x="241" y="629" class="yellow" font-weight="800">/</text>
    <text x="262" y="629" class="bright">Search/Query</text>

    <!-- l Level -->
    <rect x="382" y="614" width="20" height="20" rx="4" fill="#334155"/>
    <text x="388" y="629" class="yellow" font-weight="800">l</text>
    <text x="408" y="629" class="bright">Level filter</text>

    <!-- s Source -->
    <rect x="515" y="614" width="20" height="20" rx="4" fill="#334155"/>
    <text x="521" y="629" class="yellow" font-weight="800">s</text>
    <text x="541" y="629" class="bright">Source</text>

    <!-- e Export -->
    <rect x="620" y="614" width="20" height="20" rx="4" fill="#334155"/>
    <text x="626" y="629" class="yellow" font-weight="800">e</text>
    <text x="646" y="629" class="bright">Export</text>

    <!-- enter Details -->
    <rect x="720" y="614" width="46" height="20" rx="4" fill="#334155"/>
    <text x="726" y="629" class="yellow" font-weight="800">enter</text>
    <text x="772" y="629" class="bright">Details &amp; JSON</text>

    <!-- ? Help -->
    <rect x="905" y="614" width="20" height="20" rx="4" fill="#334155"/>
    <text x="911" y="629" class="yellow" font-weight="800">?</text>
    <text x="931" y="629" class="bright">Help</text>
  </g>
</svg>
